name: Оновлення даних про закупівлі електроенергії

on:
  workflow_dispatch:
    inputs:
      command:
        description: "probe (діагностика), all (повний цикл), resume (докачати і перебудувати), build (лише звіт)"
        default: "all"
        type: choice
        options: [all, probe, resume, search, details, build]
      extra:
        description: "Додаткові параметри, напр. --full або --probe-from 2026-03-01"
        default: ""
        required: false
      chain:
        description: "Службове: номер автоматичного продовження"
        default: "0"
        required: false
  schedule:
    - cron: "41 2 * * 2"   # щовівторка о 02:41 UTC

permissions:
  contents: write
  actions: write

concurrency:
  group: power-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Запуск
        env:
          CMD: ${{ github.event.inputs.command || 'all' }}
          EXTRA: ${{ github.event.inputs.extra }}
        run: python power.py "$CMD" --budget-min 300 $EXTRA

      - name: Збереження результатів у репозиторій
        if: always() && (github.event.inputs.command || 'all') != 'probe'
        run: |
          git config user.name "power-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -q -m "Оновлення даних Prozorro $(date -u +%Y-%m-%d)"
            git pull -q --rebase && git push -q
          fi

      - name: Продовжити, якщо не встигли завантажити все
        if: success() && (github.event.inputs.command || 'all') != 'probe'
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ github.event.inputs.chain || '0' }}
        run: |
          if python -c "import json,sys; sys.exit(0 if json.load(open('data/state.json')).get('details_incomplete') else 1)"; then
            if [ "$CHAIN" -lt 10 ]; then
              echo "Збір не завершено — запускаю продовження №$((CHAIN+1))"
              gh workflow run update.yml --ref "$GITHUB_REF_NAME" -f command=resume -f chain=$((CHAIN+1))
            else
              echo "Досягнуто ліміту автоматичних продовжень (10). Запустіть resume вручну."
            fi
          fi
